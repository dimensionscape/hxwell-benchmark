name: A/B Crossbyte settings

on:
  push:
    branches: [ab]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - id: matrix
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          from bench.config import load_config, select_cases
          config, _ = load_config()
          cases = select_cases(config, open("ab/cases.txt").read().strip())
          base = open("ab/base.txt").read().strip()
          include = [dict(case, variant=variant, ref=(base if variant == "base" else ""))
                     for case in cases for variant in ("base", "tuned")]
          print("matrix=" + json.dumps({"include": include}, separators=(",", ":")))
          EOF

  build:
    needs: plan
    name: Build ${{ matrix.variant }} ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ matrix.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: krdlab/setup-haxe@18e4b483cfffca2fb8881530bf8a6cec39dac8fb # v2
        with:
          haxe-version: '4.3.7'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: matrix.target == 'jvm'
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Haxelib dependencies
        env:
          TARGET: ${{ matrix.target }}
        run: |
          haxelib install haxe-concurrent 5.1.5 --always --quiet
          haxelib install uuid 2.4.1 --always --quiet
          haxelib install crypto 1.3.0 --always --quiet
          if [ "$TARGET" = jvm ]; then haxelib install hxjava 4.2.0 --always --quiet; fi
      - name: Install native build tools
        if: matrix.target == 'cpp'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake
      - name: Fetch
        env:
          DRIVER: ${{ matrix.driver }}
          TARGET: ${{ matrix.target }}
          POLL_BACKEND: ${{ matrix.poll_backend || 'default' }}
        run: |
          case "$DRIVER" in
            crossbyte) NAMES=hxwell,hxwell-crossbyte,crossbyte,emitter ;;
            undertow) NAMES=hxwell,maven ;;
            *) NAMES=hxwell ;;
          esac
          if [ "$TARGET" = cpp ]; then NAMES="$NAMES,libhxcpp"; fi
          if [ "$POLL_BACKEND" = libuv ]; then NAMES="$NAMES,crossbyte-libuv,libuv"; fi
          python -m bench fetch --names "$NAMES"
      - name: Build
        env:
          BENCH_CASE: ${{ matrix.id }}
        run: python -m bench build --case "$BENCH_CASE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.variant }}-${{ matrix.id }}
          path: out/build/${{ matrix.id }}.tar.gz
          retention-days: 7

  measure:
    needs: [plan, build]
    if: always() && !cancelled() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build wrk
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libssl-dev
          python -m bench fetch --names wrk
          make -C dependencies/wrk -j2 WITH_OPENSSL=/usr VER=4.2.0 > /dev/null
      - name: Build the pinned HashLink JIT runtime
        run: |
          sudo apt-get install -y libpng-dev libturbojpeg0-dev libvorbis-dev zlib1g-dev libsqlite3-dev
          python -m bench fetch --names hashlink
          python -m bench hashlink --out out/hashlink
          echo "$GITHUB_WORKSPACE/out/hashlink" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: base-*
          merge-multiple: true
          path: out/archives-base
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tuned-*
          merge-multiple: true
          path: out/archives-tuned
      - run: |
          python -m bench unpack --archives out/archives-base --out out/apps-base
          python -m bench unpack --archives out/archives-tuned --out out/apps-tuned
      - name: Measure with the stock harness, ABBA
        run: |
          nproc; grep 'model name' /proc/cpuinfo | head -1
          CASES="$(cat ab/cases.txt)"
          n=0
          for variant in $(cat ab/order.txt); do
            n=$((n + 1))
            echo "=== round $n: $variant"
            python -m bench run --cases "$CASES" --profile stress --bundles out/apps-$variant \
              --wrk "$GITHUB_WORKSPACE/dependencies/wrk/wrk" --out out/results/$n-$variant || echo "round $n had invalid trials"
          done
      - name: Summary
        if: always()
        run: python3 ab/summarize.py out/results | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ab-results
          retention-days: 14
          path: out/results/
